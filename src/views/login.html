<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Status Page</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #07070e;
    --border:  rgba(255,255,255,0.09);
    --border2: rgba(255,255,255,0.16);
    --txt:     #e8e8f0;
    --txt2:    #8888aa;
    --txt3:    #5a5a78;
    --accent:  #7c5cfc;
    --accent2: #5b3de8;
    --green:   #22c55e;
    --r:       14px;
  }
  html, body { height: 100%; font-size: 15px; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 60% at 50% 0%,  rgba(124,92,252,.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 100%, rgba(6,182,212,.07)  0%, transparent 55%);
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px; margin: 24px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border2);
    border-radius: 20px; padding: 40px 36px;
    backdrop-filter: blur(16px);
    box-shadow: 0 32px 80px rgba(0,0,0,.45);
  }
  .logo { display: flex; align-items: center; gap: 11px; margin-bottom: 28px; }
  .logo-dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 3px rgba(34,197,94,.2), 0 0 14px rgba(34,197,94,.45);
    animation: pulse 2.4s ease-in-out infinite; flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(34,197,94,.2), 0 0 14px rgba(34,197,94,.45); }
    50%      { box-shadow: 0 0 0 6px rgba(34,197,94,.1), 0 0 22px rgba(34,197,94,.65); }
  }
  .logo-text { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
  .logo-text span { color: var(--txt2); font-weight: 400; margin-left: 3px; }
  h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
  .sub { font-size: .85rem; color: var(--txt2); margin-bottom: 28px; }

  .error-msg {
    display: none; align-items: center; gap: 8px;
    background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
    border-radius: 10px; padding: 10px 14px;
    font-size: .82rem; color: #fca5a5; margin-bottom: 16px;
  }
  .error-msg.show { display: flex; }
  .error-msg svg { flex-shrink: 0; }

  /* Step 1 — button */
  .btn-github {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 16px;
    background: #24292f; border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--r); color: #fff;
    font-size: .9rem; font-weight: 600;
    cursor: pointer; transition: background .2s, transform .1s;
  }
  .btn-github:hover  { background: #32383f; }
  .btn-github:active { transform: scale(.98); }
  .btn-github:disabled { opacity: .5; cursor: not-allowed; }

  /* Step 2 — code display */
  #step-code { display: none; }
  .code-box {
    background: rgba(255,255,255,.06); border: 1px solid var(--border2);
    border-radius: var(--r); padding: 20px;
    text-align: center; margin-bottom: 16px;
  }
  .code-label { font-size: .75rem; color: var(--txt3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .code-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .user-code {
    font-size: 2rem; font-weight: 800; letter-spacing: .18em;
    color: var(--txt); font-variant-numeric: tabular-nums;
  }
  .btn-copy {
    background: rgba(255,255,255,.08); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--txt2); padding: 6px 10px;
    font-size: .75rem; cursor: pointer; transition: background .2s, color .2s;
    white-space: nowrap;
  }
  .btn-copy:hover { background: rgba(255,255,255,.14); color: var(--txt); }
  .btn-copy.copied { color: var(--green); border-color: rgba(34,197,94,.4); }
  .open-link {
    display: block; width: 100%; padding: 11px;
    background: var(--accent); border: none; border-radius: var(--r);
    color: #fff; font-size: .9rem; font-weight: 600;
    text-decoration: none; text-align: center;
    cursor: pointer; transition: background .2s;
    margin-bottom: 14px;
  }
  .open-link:hover { background: var(--accent2); }
  .status-row { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--txt2); }
  .spinner {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.15);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back { text-align: center; margin-top: 20px; }
  .back a { color: var(--txt3); font-size: .8rem; text-decoration: none; transition: color .2s; }
  .back a:hover { color: var(--txt2); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-dot"></div>
    <div class="logo-text">Status <span>Page</span></div>
  </div>
  <h2>Welcome back</h2>
  <p class="sub">Sign in with GitHub to access the dashboard.</p>

  <div class="error-msg" id="error-msg">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <circle cx="7.5" cy="7.5" r="6.5" stroke="#f87171" stroke-width="1.4"/>
      <path d="M7.5 4.5v3.5M7.5 10.5v.5" stroke="#f87171" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span id="error-text">Access denied.</span>
  </div>

  <!-- Step 1 -->
  <div id="step-btn">
    <button class="btn-github" id="gh-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577
                 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756
                 -1.09-.745.083-.729.083-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305
                 3.495.998.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93
                 0-1.31.468-2.38 1.235-3.22-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322
                 3.3 1.23a11.52 11.52 0 0 1 3.003-.404c1.02.005 2.047.138 3.006.404
                 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176
                 .77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.625-5.48 5.92.43.372.823 1.102.823 2.222
                 0 1.606-.015 2.898-.015 3.293 0 .322.216.694.825.576C20.565 21.796 24 17.298 24 12
                 24 5.37 18.627 0 12 0z"/>
      </svg>
      Continue with GitHub
    </button>
  </div>

  <!-- Step 2 -->
  <div id="step-code">
    <div class="code-box">
      <div class="code-label">Enter this code on GitHub</div>
      <div class="code-row">
        <div class="user-code" id="user-code">----</div>
        <button class="btn-copy" id="copy-btn" onclick="copyCode()">Copy</button>
      </div>
    </div>
    <a class="open-link" id="verify-link" href="#" target="_blank">Open github.com/login/device ↗</a>
    <div class="status-row">
      <div class="spinner"></div>
      <span>Waiting for you to authorise on GitHub…</span>
    </div>
  </div>

  <div class="back"><a href="/">← Back to status page</a></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const err = params.get('error');
if (err) {
  const box = document.getElementById('error-msg');
  const txt = document.getElementById('error-text');
  txt.textContent = err === 'denied'
    ? 'Access denied — your GitHub account is not authorised.'
    : 'GitHub login failed — please try again.';
  box.classList.add('show');
}

const nextUrl = params.get('next') || '/endpoints';
let pollTimer;

document.getElementById('gh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('gh-btn');
  btn.disabled = true;
  btn.textContent = 'Starting…';

  try {
    const r = await fetch('/auth/github/device/start', { method: 'POST' });
    const data = await r.json();
    if (data.error) { showError(data.error); btn.disabled = false; btn.textContent = 'Continue with GitHub'; return; }

    document.getElementById('user-code').textContent   = data.userCode;
    document.getElementById('verify-link').href        = data.verificationUri;
    document.getElementById('verify-link').textContent = `Open ${data.verificationUri} ↗`;
    document.getElementById('step-btn').style.display  = 'none';
    document.getElementById('step-code').style.display = 'block';

    poll(data.flowId);
  } catch (e) { showError(e.message); btn.disabled = false; btn.textContent = 'Continue with GitHub'; }
});

function poll(flowId) {
  pollTimer = setTimeout(async () => {
    try {
      const r = await fetch('/auth/github/device/status?flowId=' + flowId);
      const d = await r.json();
      if (d.status === 'authed')   { location.href = nextUrl; return; }
      if (d.status === 'denied')   { showError('Access denied — your GitHub account is not authorised.'); reset(); return; }
      if (d.status === 'expired')  { showError('Code expired — please try again.'); reset(); return; }
      if (d.status === 'error')    { showError('GitHub authorisation failed — please try again.'); reset(); return; }
      poll(flowId);
    } catch { poll(flowId); }
  }, 4000);
}

function reset() {
  clearTimeout(pollTimer);
  document.getElementById('step-code').style.display = 'none';
  document.getElementById('step-btn').style.display  = 'block';
  const btn = document.getElementById('gh-btn');
  btn.disabled = false;
  btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.3 1.23a11.52 11.52 0 0 1 3.003-.404c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.625-5.48 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.898-.015 3.293 0 .322.216.694.825.576C20.565 21.796 24 17.298 24 12 24 5.37 18.627 0 12 0z"/></svg> Continue with GitHub`;
}

function copyCode() {
  const code = document.getElementById('user-code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function showError(msg) {
  const box = document.getElementById('error-msg');
  document.getElementById('error-text').textContent = msg;
  box.classList.add('show');
}
</script>
</body>
</html>
